[workspace]
members = [
    "muffin",
    "crates/muffin-blacklist",
    "crates/muffin-complete",
    "crates/muffin-editor",
    "crates/muffin-env",
    "crates/muffin-exec",
    "crates/muffin-highlight",
    "crates/muffin-platform",
    "crates/muffin-platform-mock",
    "crates/muffin-platform-unix",
    "crates/muffin-prompt",
    "crates/muffin-reader",
    "crates/muffin-syntax",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.0"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["process", "signal", "fs", "term", "poll", "resource"] }
muffin-platform = { path = "crates/muffin-platform" }
muffin-platform-unix = { path = "crates/muffin-platform-unix" }
muffin-platform-mock = { path = "crates/muffin-platform-mock" }
muffin-editor = { path = "crates/muffin-editor" }
muffin-prompt = { path = "crates/muffin-prompt" }
